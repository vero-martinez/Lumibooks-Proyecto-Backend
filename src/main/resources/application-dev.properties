# application-dev.properties

# Configuración utilizada durante el desarrollo.
# Se carga cuando SPRING_PROFILES_ACTIVE=dev.

# =========================
# Base de datos
# =========================

# Credenciales obtenidas desde variables del sistema.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Solo valida la estructura de la base de datos.
spring.jpa.hibernate.ddl-auto=validate

# Muestra las consultas SQL en la consola.
spring.jpa.show-sql=true

# =========================
# Redis
# =========================

# Configuración de Redis para el entorno de desarrollo.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# =========================
# JWT
# =========================

# Configuración de los tokens de autenticación.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# =========================
# Cookies
# =========================

# En desarrollo se permite usar HTTP.
cookie.secure=${COOKIE_SECURE:false}

# =========================
# CORS
# =========================

# Frontend autorizado para acceder al backend.
app.cors.allowed-origins=http://localhost:3000

# =========================
# Cloudinary
# =========================

# Credenciales para el almacenamiento de imágenes.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}