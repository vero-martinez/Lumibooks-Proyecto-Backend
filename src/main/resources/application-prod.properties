# application-prod.properties

# Configuración utilizada en producción.
# Se carga cuando SPRING_PROFILES_ACTIVE=prod.

# =========================
# Base de datos
# =========================

# Credenciales obtenidas desde variables del sistema.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Solo valida la estructura de la base de datos.
spring.jpa.hibernate.ddl-auto=validate

# =========================
# Redis
# =========================

# Configuración de Redis para producción.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# =========================
# JWT
# =========================

# Configuración de los tokens de autenticación.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# =========================
# Cookies
# =========================

# En producción las cookies solo se envían mediante HTTPS.
cookie.secure=true

# =========================
# CORS
# =========================

# Dominio autorizado del frontend en producción.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}