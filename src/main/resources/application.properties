# application.properties

# Configuración base de la aplicación.
# Contiene propiedades comunes para todos los perfiles.
#
# Las configuraciones específicas de cada entorno se encuentran en:
# - application-dev.properties (desarrollo)
# - application-prod.properties (producción)

spring.application.name=lumibooks-backend

# Puerto donde se ejecuta la aplicación.
server.port=8081

# =========================
# Base de datos
# =========================

# Credenciales obtenidas desde variables del sistema.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Solo valida la estructura de la base de datos.
spring.jpa.hibernate.ddl-auto=validate

# =========================
# Cloudinary
# =========================

# Credenciales para el almacenamiento de imágenes.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =========================
# Correo (SMTP Gmail)
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# Código de recuperación de contraseña
# =========================
app.reset-code.expiration-minutes=${RESET_CODE_EXPIRATION_MINUTES:10}
app.reset-code.max-attempts=${RESET_CODE_MAX_ATTEMPTS:5}